        // Station Geometry Creation Functions
        function createCoriolisStation(data) {
            const group = new THREE.Group();
            const torusRadius = data.visualSize / 2;
            const tubeRadius = torusRadius * 0.2;
            const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.4, roughness: 0.6 });
            const torusGeometry = new THREE.TorusGeometry(torusRadius, tubeRadius, 16, 40);
            const torus = new THREE.Mesh(torusGeometry, material);
            torus.rotation.x = Math.PI / 2;
            group.add(torus);

            const spokeMaterial = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.2, roughness: 0.8 });
            for (let i = 0; i < 6; i++) { 
                const spokeGeometry = new THREE.CylinderGeometry(tubeRadius * 0.2, tubeRadius * 0.2, torusRadius * 1.9, 6);
                const spoke = new THREE.Mesh(spokeGeometry, spokeMaterial);
                const angle = (i / 6) * Math.PI * 2;
                spoke.position.set(Math.cos(angle) * torusRadius * 0.5, 0, Math.sin(angle) * torusRadius * 0.5);
                spoke.lookAt(torus.position); 
                spoke.rotateX(Math.PI / 2); 
                group.add(spoke); 
            }
            const hubGeometry = new THREE.SphereGeometry(tubeRadius * 1.5, 16, 16);
            const hub = new THREE.Mesh(hubGeometry, material);
            group.add(hub);

            group.userData = { isStation: true, name: data.name, type: data.type, visualSize: data.visualSize, rotationSpeed: data.rotationSpeed, navLights: [] };
            for(let i=0; i<4; i++) {
                const lightGeo = new THREE.SphereGeometry(0.03, 6,6);
                const lightMat = new THREE.MeshBasicMaterial({color: (i%2===0) ? 0xff0000: 0x00ff00});
                const light = new THREE.Mesh(lightGeo, lightMat);
                light.position.set(Math.cos(i*Math.PI/2) * (torusRadius + tubeRadius), 0, Math.sin(i*Math.PI/2) * (torusRadius + tubeRadius));
                group.add(light);
                group.userData.navLights.push(light);
            }
            return group;
        }

        function createTorusStation(data) {
            const geometry = new THREE.TorusGeometry(data.visualSize, data.tubeRadius || data.visualSize * 0.2, 20, 50); 
            const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.5, roughness: 0.5 });
            const torus = new THREE.Mesh(geometry, material);
            torus.rotation.x = Math.PI / 2;
            torus.userData = { isStation: true, name: data.name, type: data.type, visualSize: data.visualSize, rotationSpeed: data.rotationSpeed, navLights: [] };
            for(let i=0; i<3; i++) {
                const lightGeo = new THREE.SphereGeometry(0.02, 6,6);
                const lightMat = new THREE.MeshBasicMaterial({color: 0xff0000});
                const light = new THREE.Mesh(lightGeo, lightMat);
                const angle = (i/3) * Math.PI * 2;
                light.position.set(Math.cos(angle) * (data.visualSize + (data.tubeRadius||0)*0.5), 0, Math.sin(angle) * (data.visualSize + (data.tubeRadius||0)*0.5));
                torus.userData.navLights.push(light); 
                torus.add(light);
            }
            return torus;
        }

        function createModularStation(data) {
            const group = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.6, roughness: 0.4 });
            const mainModuleSize = data.visualSize * 0.6;
            const mainModule = new THREE.Mesh(new THREE.BoxGeometry(mainModuleSize, mainModuleSize, mainModuleSize * 1.5), material);
            group.add(mainModule);
            group.userData = { isStation: true, name: data.name, type: data.type, visualSize: data.visualSize, navLights: [], rotatingParts: [] };

            for (let i = 0; i < 4; i++) {
                const armModule = new THREE.Mesh(new THREE.CylinderGeometry(mainModuleSize * 0.2, mainModuleSize * 0.2, mainModuleSize * 1.2, 8), material);
                armModule.position.set(
                    (i % 2 === 0 ? (i === 0 ? 1 : -1) : 0) * mainModuleSize * 0.8,
                    (i % 2 !== 0 ? (i === 1 ? 1 : -1) : 0) * mainModuleSize * 0.8,
                    0
                );
                armModule.lookAt(0,0,0);
                group.add(armModule);
                const lightGeo = new THREE.SphereGeometry(0.025, 6,6);
                const lightMat = new THREE.MeshBasicMaterial({color: 0x00ff00});
                const light = new THREE.Mesh(lightGeo, lightMat);
                light.position.copy(armModule.position).multiplyScalar(1.1); 
                group.add(light);
                group.userData.navLights.push(light);
            }
            return group;
        }

        function createONeillCylinderStation(data) {
            const geometry = new THREE.CylinderGeometry(data.visualRadius, data.visualRadius, data.visualLength, 32, 1, true); 
            const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.7, roughness: 0.3, side: THREE.DoubleSide });
            const cylinder = new THREE.Mesh(geometry, material);
            cylinder.rotation.z = Math.PI / 2; 
            cylinder.userData = { isStation: true, name: data.name, type: data.type, visualSize: Math.max(data.visualLength, data.visualRadius * 2), rotationSpeed: data.rotationSpeed };
            return cylinder;
        }

        function createDodecOutpostStation(data) {
            const geometry = new THREE.DodecahedronGeometry(data.visualSize / 2, 1); 
            const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.2, roughness: 0.8 });
            const dodec = new THREE.Mesh(geometry, material);
            dodec.userData = { isStation: true, name: data.name, type: data.type, visualSize: data.visualSize };
            return dodec;
        }
        
        function createGeodesicDomeClusterStation(data) {
            const group = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.1, roughness: 0.9 });
            const mainDome = new THREE.Mesh(new THREE.IcosahedronGeometry(data.visualSize / 2, 3), material); 
            group.add(mainDome);
            group.userData = { isStation: true, name: data.name, type: data.type, visualSize: data.visualSize, navLights: [] };
            for(let i=0; i<4; i++) {
                const smallDome = new THREE.Mesh(new THREE.IcosahedronGeometry(data.visualSize / 5, 1), material);
                const angle = (i/4) * Math.PI * 2;
                smallDome.position.set(Math.cos(angle) * data.visualSize * 0.6, 0, Math.sin(angle) * data.visualSize * 0.6);
                group.add(smallDome);
                const lightGeo = new THREE.SphereGeometry(0.02, 6,6);
                const lightMat = new THREE.MeshBasicMaterial({color: 0xffaa00});
                const light = new THREE.Mesh(lightGeo, lightMat);
                light.position.copy(smallDome.position).y += data.visualSize / 5 + 0.01;
                group.add(light);
                group.userData.navLights.push(light);
            }
            return group;
        }

        function createLaunchPlatformArrayStation(data) {
            const group = new THREE.Group();
            const platformMaterial = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.8, roughness: 0.2 });
            const towerMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.7, roughness: 0.4 });
            const numPlatforms = 3;
            const spacing = data.visualSize / numPlatforms;

            for (let i = 0; i < numPlatforms; i++) {
                const platform = new THREE.Mesh(new THREE.BoxGeometry(spacing * 0.8, data.visualSize * 0.05, data.visualSize * 0.3), platformMaterial);
                platform.position.x = (i - (numPlatforms -1)/2) * spacing;
                group.add(platform);

                const tower = new THREE.Mesh(new THREE.CylinderGeometry(spacing * 0.05, spacing * 0.05, data.visualSize * 0.4, 8), towerMaterial);
                tower.position.x = platform.position.x;
                tower.position.y = data.visualSize * 0.225;
                group.add(tower);
            }
            group.userData = { isStation: true, name: data.name, type: data.type, visualSize: data.visualSize };
            return group;
        }

        function createTrussSpindleStation(data) {
            const group = new THREE.Group();
            const spindleMaterial = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.6, roughness: 0.5 });
            const moduleMaterial = new THREE.MeshStandardMaterial({ color: new THREE.Color(data.color).offsetHSL(0,0,0.1), metalness: 0.4, roughness: 0.7 });

            const spindleLength = data.visualSize;
            const spindleRadius = data.visualSize * 0.05;
            const spindle = new THREE.Mesh(new THREE.CylinderGeometry(spindleRadius, spindleRadius, spindleLength, 12), spindleMaterial);
            spindle.rotation.x = Math.PI / 2; 
            group.add(spindle);

            const moduleSize = data.visualSize * 0.2;
            const module1 = new THREE.Mesh(new THREE.DodecahedronGeometry(moduleSize, 0), moduleMaterial);
            module1.position.z = spindleLength / 2 + moduleSize * 0.6;
            spindle.add(module1); 

            const module2 = new THREE.Mesh(new THREE.DodecahedronGeometry(moduleSize, 0), moduleMaterial);
            module2.position.z = -spindleLength / 2 - moduleSize * 0.6;
            spindle.add(module2);

            group.userData = { isStation: true, name: data.name, type: data.type, visualSize: data.visualSize, rotationSpeed: data.rotationSpeed, navLights: [] };
            [module1, module2].forEach(mod => {
                const lightGeo = new THREE.SphereGeometry(0.02, 6,6);
                const lightMat = new THREE.MeshBasicMaterial({color: 0xff0000});
                const light = new THREE.Mesh(lightGeo, lightMat);
                light.position.copy(mod.position).normalize().multiplyScalar(mod.position.length() + 0.03); 
                group.userData.navLights.push(light);
                spindle.add(light); 
            });
            return group;
        }

        function createSkeletalFrameStation(data) {
            const group = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: data.color, metalness: 0.9, roughness: 0.2 });
            const beamRadius = data.visualSize * 0.02;
            const length = data.visualSize;

            for(let i=0; i<5; i++){ // Increased complexity slightly
                const beamGeo = new THREE.CylinderGeometry(beamRadius, beamRadius, length * (0.6 + Math.random()*0.6), 6);
                const beam = new THREE.Mesh(beamGeo, material);
                beam.position.set((Math.random()-0.5)*length*0.5, (Math.random()-0.5)*length*0.5, (Math.random()-0.5)*length*0.5);
                beam.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                group.add(beam);
            }
            const centerSphere = new THREE.Mesh(new THREE.SphereGeometry(length*0.1, 8,8), material);
            group.add(centerSphere);

            group.userData = { isStation: true, name: data.name, type: data.type, visualSize: data.visualSize };
            return group;
        }


        function createStations() {
            stationsData.forEach(sData => {
                let stationMesh;
                switch (sData.type) {
                    case "CORIOLIS": stationMesh = createCoriolisStation(sData); break;
                    case "TORUS": stationMesh = createTorusStation(sData); break;
                    case "MODULAR": stationMesh = createModularStation(sData); break;
                    case "ONEILL_CYLINDER": stationMesh = createONeillCylinderStation(sData); break;
                    case "DODEC_OUTPOST": stationMesh = createDodecOutpostStation(sData); break;
                    case "GEODESIC_DOME_CLUSTER": stationMesh = createGeodesicDomeClusterStation(sData); break;
                    case "LAUNCH_PLATFORM_ARRAY": stationMesh = createLaunchPlatformArrayStation(sData); break;
                    case "ASTEROID_BASE": 
                        stationMesh = new THREE.Mesh(new THREE.SphereGeometry(sData.visualSize * 0.5, 8, 6), new THREE.MeshStandardMaterial({color: sData.color, metalness:0.2, roughness:0.8}));
                        stationMesh.userData = { isStation: true, name: sData.name, type: sData.type, visualSize: sData.visualSize };
                        break;
                    case "TRUSS_SPINDLE": stationMesh = createTrussSpindleStation(sData); break;
                    case "SKELETAL_FRAME": stationMesh = createSkeletalFrameStation(sData); break;
                    default:
                        console.warn("Unknown station type:", sData.type);
                        stationMesh = new THREE.Mesh(new THREE.BoxGeometry(sData.visualSize, sData.visualSize, sData.visualSize), new THREE.MeshStandardMaterial({color: 0xff0000}));
                        stationMesh.userData = { isStation: true, name: sData.name, type: "UNKNOWN", visualSize: sData.visualSize };
                }

                let parentObjectMesh;
                let parentVisualRadius = 0;
                let parentOrbitalRadius = 0; 
                let parentCurrentAngle = 0;  

                if (sData.orbitsBody) {
                    const planetParent = planets.find(p => p.mesh.userData.name === sData.orbitsBody);
                    if (planetParent) {
                        parentObjectMesh = planetParent.mesh;
                        parentVisualRadius = planetParent.mesh.userData.visualRadius;
                    } else { 
                        for (const p of planets) {
                            const moonParent = p.moonObjects.find(m => m.mesh.name === sData.orbitsBody);
                            if (moonParent) {
                                parentObjectMesh = moonParent.mesh;
                                parentVisualRadius = moonParent.mesh.userData.visualRadius || 0.1; 
                                break;
                            }
                        }
                    }
                } else if (sData.inAsteroidBelt) { 
                    parentObjectMesh = sun; 
                    const beltInfo = asteroidBeltsData.find(b => b.name === sData.inAsteroidBelt);
                    if (beltInfo) {
                        sData.orbitalRadius = (beltInfo.minRadiusAU + Math.random() * (beltInfo.maxRadiusAU - beltInfo.minRadiusAU)) * DISTANCE_SCALE_AU_TO_THREEJS;
                    } else {
                         sData.orbitalRadius = 40 * DISTANCE_SCALE_AU_TO_THREEJS; 
                    }
                } else if (sData.customOrbit && sData.customOrbit.lagrangePoint === "L5") {
                    const primaryBody = planets.find(p => p.mesh.userData.name === sData.customOrbit.parentPlanetName);
                    const secondaryBodyPlanet = planetsData.find(pd => pd.name === sData.customOrbit.parentPlanetName);
                    const secondaryMoonData = secondaryBodyPlanet ? secondaryBodyPlanet.moons.find(m => m.name === sData.customOrbit.moonName) : null;
                    const secondaryBodyObj = primaryBody ? primaryBody.moonObjects.find(m => m.mesh.name === sData.customOrbit.moonName) : null;
                    
                    if (primaryBody && secondaryBodyObj && secondaryMoonData) {
                        parentObjectMesh = primaryBody.mesh; 
                        parentOrbitalRadius = (planetsData.find(pd => pd.name === primaryBody.mesh.userData.name).visualRadius + secondaryMoonData.orbitalRadius); // Moon's orbit radius from planet center
                        parentCurrentAngle = secondaryBodyObj.currentAngle;   
                        sData.orbitalRadius = parentOrbitalRadius; 
                        sData.orbitalPeriodDays = secondaryMoonData.orbitalPeriodDays; 
                    } else {
                        console.warn("Could not find parent/moon for L5 station:", sData.name);
                        parentObjectMesh = sun; 
                        sData.orbitalRadius = 50 * DISTANCE_SCALE_AU_TO_THREEJS; 
                    }
                }


                const stationOrbitalRadius = sData.orbitsBody === "Sun" && sData.orbitalRadiusAU // For Kuiper Gateway
                                            ? sData.orbitalRadiusAU * DISTANCE_SCALE_AU_TO_THREEJS
                                            : (sData.customOrbit && sData.customOrbit.lagrangePoint === "L5" 
                                                ? sData.orbitalRadius 
                                                : (sData.inAsteroidBelt ? sData.orbitalRadius : sData.orbitalRadius)); // Use sData.orbitalRadius directly for planet/moon orbits
                
                let initialAngle = Math.random() * Math.PI * 2;
                if (sData.customOrbit && sData.customOrbit.lagrangePoint === "L5") {
                    initialAngle = parentCurrentAngle - Math.PI / 3; 
                }
                
                stationMesh.position.x = stationOrbitalRadius * Math.cos(initialAngle);
                stationMesh.position.z = stationOrbitalRadius * Math.sin(initialAngle);
                
                if(parentObjectMesh === sun && sData.orbitalInclinationDegrees) {
                    const stationInclinationRad = THREE.MathUtils.degToRad(sData.orbitalInclinationDegrees);
                    stationMesh.position.applyAxisAngle(new THREE.Vector3(1,0,0), stationInclinationRad);
                }


                if (parentObjectMesh && !(sData.inAsteroidBelt || (sData.customOrbit && sData.customOrbit.lagrangePoint))) {
                    parentObjectMesh.add(stationMesh);
                } else { 
                    scene.add(stationMesh);
                }
                
                const stationObject = {
                    mesh: stationMesh,
                    parentMesh: parentObjectMesh || sun, 
                    orbitalRadius: stationOrbitalRadius,
                    angularSpeedBase: (2 * Math.PI) / ((sData.orbitalPeriodDays || sData.orbitalPeriodYears * 365.25 || 1) * 20), 
                    currentAngle: initialAngle,
                    rotationSpeed: sData.rotationSpeed || 0,
                    orbitalInclinationRad: (parentObjectMesh === sun && sData.orbitalInclinationDegrees) ? THREE.MathUtils.degToRad(sData.orbitalInclinationDegrees) : 0,
                    isL5Station: (sData.customOrbit && sData.customOrbit.lagrangePoint === "L5"),
                    l5ParentMoonName: (sData.customOrbit && sData.customOrbit.lagrangePoint === "L5") ? sData.customOrbit.moonName : null,
                    l5ParentPlanetName: (sData.customOrbit && sData.customOrbit.lagrangePoint === "L5") ? sData.customOrbit.parentPlanetName : null

                };
                stations.push(stationObject);
                clickableObjects.push(stationMesh);
            });
        }
        

        function init() {

            }

            globalClock = new THREE.Clock();
            scene = new THREE.Scene();

            scene.add(hemisphereLight);


            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(0, 200, 350);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
            scene.add(ambientLight);
            const sunLight = new THREE.PointLight(sunData.color, 1.5, 7000, 0.7); 
            scene.add(sunLight);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 0.1; 
            controls.maxDistance = 7000; 
            controls.enableRotate = false; 

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            pauseButton = document.getElementById('pauseButton');
            speedDisplay = document.getElementById('speedDisplay');
            speedSlider = document.getElementById('speedSlider'); 
            geminiPlanetInfoButton = document.getElementById('geminiPlanetInfoButton');
            fullscreenButton = document.getElementById('fullscreenButton'); 
            geminiInfoModal = document.getElementById('geminiInfoModal');
            closeModalButton = document.getElementById('closeModalButton');
            modalTitle = document.getElementById('modalTitle');
            modalBodyContent = document.getElementById('modalBodyContent');
            objectSelectionMenu = document.getElementById('objectSelectionMenu'); 
            objectListElement = document.getElementById('objectList'); 

            updateSpeedDisplay(); 
            speedSlider.value = simulationSpeed; 

            pauseButton.addEventListener('click', togglePause);

                simulationSpeed = parseFloat(event.target.value);

            });
            geminiPlanetInfoButton.addEventListener('click', () => openInfoModal('planet_comet_station')); 
            fullscreenButton.addEventListener('click', toggleBrowserFullscreen); 
            closeModalButton.addEventListener('click', () => { 
                geminiInfoModal.style.display = "none";
                objectSelectionMenu.style.display = "none"; 
            });
            window.addEventListener('click', (event) => { 
                if (event.target == geminiInfoModal) {
                    geminiInfoModal.style.display = "none";
                }
            });

            const highlightSegments = 32;
            const highlightPoints = [];
            for (let i = 0; i <= highlightSegments; i++) {
                const angle = (i / highlightSegments) * Math.PI * 2;
                highlightPoints.push(new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)));
            }
            const highlightGeometry = new THREE.BufferGeometry().setFromPoints(highlightPoints);
            const highlightMaterial = new THREE.LineBasicMaterial({ color: 0xFFFF00, transparent: true, opacity: 0.9 });
            highlightMesh = new THREE.LineLoop(highlightGeometry, highlightMaterial);
            highlightMesh.visible = false;
            scene.add(highlightMesh);

            createSun();
            createPlanetsAndMoons(); 
            createAsteroidBelts(); 
            createComets();       
            createStations();     
            
            orderedSelectableObjects.push(sun); 
            planets.forEach(p => {
                orderedSelectableObjects.push(p.mesh);
                p.moonObjects.forEach(m => orderedSelectableObjects.push(m.mesh)); 
            });
            comets.forEach(c => orderedSelectableObjects.push(c.mesh)); 
            stations.forEach(s => orderedSelectableObjects.push(s.mesh));


            populateObjectSelectionMenu(); 

            createStars(); 

            if (orderedSelectableObjects.length > 0) {
                selectObjectByInteraction(orderedSelectableObjects[0]); 
                currentSelectableObjectIndex = 0;
            } else {
                updateInfoBox(); 
            }
            
            window.addEventListener('resize', onWindowResize, false);
            renderer.domElement.addEventListener('mousedown', onDocumentMouseDown, false);
            window.addEventListener('keydown', onKeyDown, false);
            window.addEventListener('keyup', onKeyUp, false);

            document.getElementById('controlsInfo').textContent = "Press F1 for Controls.";
            
            animate(); 
        }

        function onKeyDown(event) {
            switch(event.key.toLowerCase()) {
                case 'c':
                    isCKeyDown = true;
                    controls.enableRotate = true; 
                    break;
                case '[':
                    selectNextOrPreviousObject('previous');
                    break;
                case ']':
                    selectNextOrPreviousObject('next');
                    break;
                case 'f':
                    isFollowing = !isFollowing;
                    if (isFollowing && focusedObject) {
                        const objectToFollow = focusedObject;
                        targetLookAtForFocus = objectToFollow.getWorldPosition(new THREE.Vector3());

                        const objectRadius = (focusedObject.userData.isPlanet || focusedObject.userData.name === "Sun") 
                                            ? (focusedObject.userData.name === "Sun" ? sunData.visualRadius : focusedObject.userData.visualRadius)
                                            : (focusedObject.userData.isComet ? focusedObject.userData.visualRadius 
                                            : (focusedObject.userData.isStation ? focusedObject.userData.visualSize 
                                            : (focusedObject.userData.isMoon ? focusedObject.userData.visualRadius : 1))); 
                        let offsetDistance = objectRadius * 4; 
                        if (focusedObject.userData.name === "Sun") offsetDistance = objectRadius * 2.5;

                        const direction = new THREE.Vector3();
                        camera.getWorldDirection(direction);
                        targetCameraPositionForFocus = new THREE.Vector3()
                            .copy(targetLookAtForFocus)
                            .add(direction.multiplyScalar(-offsetDistance));
                    } else if (!isFollowing) {
                        targetCameraPositionForFocus = null;
                        targetLookAtForFocus = null;
                    }
                    updateInfoBox(); 
                    break;
                case 'enter': 
                    event.preventDefault(); 
                    if (focusedObject) {
                        if (isFollowing) {
                            isFollowing = false;
                            targetCameraPositionForFocus = null; 
                            targetLookAtForFocus = null; 
                        } else {
                            isFollowing = true; 
                            controls.target.copy(focusedObject.getWorldPosition(new THREE.Vector3())); 
                            
                            const objectRadius = (focusedObject.userData.isPlanet || focusedObject.userData.name === "Sun") 
                                                ? (focusedObject.userData.name === "Sun" ? sunData.visualRadius : focusedObject.userData.visualRadius)
                                                : (focusedObject.userData.isComet ? focusedObject.userData.visualRadius 
                                                : (focusedObject.userData.isStation ? focusedObject.userData.visualSize 
                                                : (focusedObject.userData.isMoon ? focusedObject.userData.visualRadius : 1)));
                            
                            let mediumDistanceMultiplier;
                            if (focusedObject.userData.name === "Sun") mediumDistanceMultiplier = 3.5;
                            else if (focusedObject.userData.isPlanet) mediumDistanceMultiplier = 6;
                            else if (focusedObject.userData.isComet) mediumDistanceMultiplier = 25;
                            else if (focusedObject.userData.isStation) mediumDistanceMultiplier = 5; 
                            else mediumDistanceMultiplier = 10; 

                            const followDistance = objectRadius * mediumDistanceMultiplier;
                            const directionFromObjectToCamera = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
                            if (directionFromObjectToCamera.lengthSq() === 0) { 
                                camera.getWorldDirection(directionFromObjectToCamera);
                                directionFromObjectToCamera.negate();
                            }
                            targetCameraPositionForFocus = new THREE.Vector3().addVectors(controls.target, directionFromObjectToCamera.multiplyScalar(followDistance));
                            targetLookAtForFocus = null; 
                        }
                        updateInfoBox();
                    }
                    break;
                case 'w': isWDown = true; break;
                case 's': isSDown = true; break;
                case 'a': isADown = true; break;
                case 'd': isDDown = true; break;
                case 'z': isZDown = true; break; 
                case 'x': isXDown = true; break; 
                case 'o':
                    orbitLinesVisible = !orbitLinesVisible;
                    orbitLineMeshes.forEach(line => {
                        line.visible = orbitLinesVisible;
                    });
                    break;
                case 'f1':
                    event.preventDefault(); 
                    openInfoModal('controls');
                    break;
                case 'f2': 
                    event.preventDefault();
                    objectSelectionMenu.style.display = objectSelectionMenu.style.display === 'block' ? 'none' : 'block';
                    break;
            }
        }

        function onKeyUp(event) {
            switch(event.key.toLowerCase()) {
                case 'c':
                    isCKeyDown = false;
                    controls.enableRotate = false;
                    break;
                case 'w': isWDown = false; break;
                case 's': isSDown = false; break;
                case 'a': isADown = false; break;
                case 'd': isDDown = false; break;
                case 'z': isZDown = false; break; 
                case 'x': isXDown = false; break; 
            }
        }
        
        function updateInfoBox() {
            let statusText = isPaused ? "(Paused)" : "(Running)";
            if (isWDown || isSDown || isADown || isDDown || isZDown || isXDown) { 
                 document.getElementById('infoBox').textContent = `Free Moving ${statusText}`;
            } else if (focusedObject) {
                const objectName = focusedObject.userData.name || "Unknown Object";
                if (isFollowing) {
                    document.getElementById('infoBox').textContent = `Following: ${objectName}`;
                } else {
                    document.getElementById('infoBox').textContent = `Focused on: ${objectName} ${statusText}`;
                }
            } else {
                document.getElementById('infoBox').textContent = `Solar System ${statusText}`;
            }
        }

        function selectObjectByInteraction(objectToSelect, maintainCameraDirection = true) {
            if (!objectToSelect) return;

            focusedObject = objectToSelect;
            if (!(isWDown || isSDown || isADown || isDDown || isZDown || isXDown)) { 
                 targetLookAtForFocus = focusedObject.getWorldPosition(new THREE.Vector3());
                const objectRadius = (focusedObject.userData.isPlanet || focusedObject.userData.name === "Sun") 
                                    ? (focusedObject.userData.name === "Sun" ? sunData.visualRadius : focusedObject.userData.visualRadius)
                                    : (focusedObject.userData.isComet ? focusedObject.userData.visualRadius 
                                    : (focusedObject.userData.isStation ? focusedObject.userData.visualSize 
                                    : (focusedObject.userData.isMoon ? focusedObject.userData.visualRadius : 1))); 
                let offsetDistance = objectRadius * 5; 
                if (focusedObject.userData.name === "Sun") offsetDistance = objectRadius * 3;
                if (focusedObject.userData.isComet) offsetDistance = objectRadius * 20; 
                if (focusedObject.userData.isStation) offsetDistance = objectRadius * 8;
                if (focusedObject.userData.isMoon) offsetDistance = objectRadius * 10;


                if (maintainCameraDirection) {
                    const direction = new THREE.Vector3();
                    camera.getWorldDirection(direction); 
                    targetCameraPositionForFocus = new THREE.Vector3()
                        .copy(targetLookAtForFocus) 
                        .add(direction.multiplyScalar(-offsetDistance));
                } else { 
                    targetCameraPositionForFocus = new THREE.Vector3(
                        targetLookAtForFocus.x,
                        targetLookAtForFocus.y + offsetDistance * 0.7, 
                        targetLookAtForFocus.z + offsetDistance * 0.7  
                    );
                }
            } else { 
                targetLookAtForFocus = null;
                targetCameraPositionForFocus = null;
            }
            
            updateInfoBox(); 
            updateHighlightAndGeminiButton();

            currentSelectableObjectIndex = orderedSelectableObjects.findIndex(obj => obj === focusedObject);
        }

        function selectNextOrPreviousObject(direction) {
            if (orderedSelectableObjects.length === 0) return;

            if (direction === 'next') {
                currentSelectableObjectIndex++;
                if (currentSelectableObjectIndex >= orderedSelectableObjects.length) {
                    currentSelectableObjectIndex = 0; 
                }
            } else if (direction === 'previous') {
                currentSelectableObjectIndex--;
                if (currentSelectableObjectIndex < 0) {
                    currentSelectableObjectIndex = orderedSelectableObjects.length - 1; 
                }
            }
            selectObjectByInteraction(orderedSelectableObjects[currentSelectableObjectIndex], false); 
        }


        function togglePause() {
            isPaused = !isPaused;
            pauseButton.textContent = isPaused ? "Resume" : "Pause";
            updateInfoBox(); 
        }

        function updateHighlightAndGeminiButton() {
            if (focusedObject && (focusedObject.userData.isPlanet || focusedObject.userData.name === "Sun" || focusedObject.userData.isComet || focusedObject.userData.isMoon || focusedObject.userData.isStation)) { 
                highlightMesh.position.copy(focusedObject.getWorldPosition(new THREE.Vector3()));
                const scaleFactor = focusedObject.userData.name === "Sun" ? sunData.visualRadius 
                                  : (focusedObject.userData.isPlanet ? focusedObject.userData.visualRadius 
                                  : (focusedObject.userData.isComet ? focusedObject.userData.visualRadius * 2 
                                  : (focusedObject.userData.isMoon ? focusedObject.userData.visualRadius * 1.5 
                                  : (focusedObject.userData.isStation ? focusedObject.userData.visualSize * 1.2 : 1))));  
                const scale = scaleFactor * 1.6; 
                highlightMesh.scale.set(scale, scale, scale);
                highlightMesh.visible = true;

                if (focusedObject.userData.isPlanet || focusedObject.userData.name === "Sun" || focusedObject.userData.isComet || focusedObject.userData.isMoon || focusedObject.userData.isStation) { 
                    geminiPlanetInfoButton.textContent = `✨ Tell Me About ${focusedObject.userData.name}`;
                    geminiPlanetInfoButton.style.display = 'block';
                } else {
                    geminiPlanetInfoButton.style.display = 'none';
                }
            } else {
                highlightMesh.visible = false;
                geminiPlanetInfoButton.style.display = 'none';
            }
        }

        function updateSpeedDisplay() {
            speedDisplay.textContent = parseFloat(simulationSpeed).toFixed(2);
        }

        function createSun() {
            const geometry = new THREE.SphereGeometry(sunData.visualRadius, 32, 16);
            const material = new THREE.MeshStandardMaterial({ color: sunData.color, emissive: sunData.color, emissiveIntensity: 0.8 }); 
            sun = new THREE.Mesh(geometry, material);
            sun.userData = { isPlanet: false, visualRadius: sunData.visualRadius, name: "Sun" }; 
            scene.add(sun);
            clickableObjects.push(sun); 
            const pointLight = scene.getObjectByProperty('type', 'PointLight');
            if (pointLight) pointLight.position.copy(sun.position); 
        }

        function createPlanetsAndMoons() {
            planetsData.forEach(pData => {
                const planetGeometry = new THREE.SphereGeometry(pData.visualRadius, 16, 8);
                const planetMaterial = new THREE.MeshStandardMaterial({ color: pData.color, metalness: 0.1, roughness: 0.8 }); 
                const planetMesh = new THREE.Mesh(planetGeometry, planetMaterial);
                planetMesh.userData = { isPlanet: true, visualRadius: pData.visualRadius, name: pData.name, moonsData: pData.moons }; 
                
                const orbitalInclinationRad = THREE.MathUtils.degToRad(pData.orbitalInclinationDegrees || 0);
                const eccentricity = pData.eccentricity || 0; 

                const scaledPlanetOrbitalRadius = pData.orbitalRadiusAU * DISTANCE_SCALE_AU_TO_THREEJS;
                const initialPlanetAngle = Math.random() * Math.PI * 2; 
                
                const r = scaledPlanetOrbitalRadius * (1 - eccentricity * Math.cos(0)); 
                let initialPosVec = new THREE.Vector3(
                    r * Math.cos(initialPlanetAngle),
                    0,
                    r * Math.sin(initialPlanetAngle)
                );
                initialPosVec.applyAxisAngle(new THREE.Vector3(1, 0, 0), orbitalInclinationRad);
                planetMesh.position.copy(initialPosVec);


                const planetObject = { 
                    name: pData.name,
                    mesh: planetMesh,
                    orbitalRadius: scaledPlanetOrbitalRadius, 
                    angularSpeedBase: (2 * Math.PI) / (pData.orbitalPeriodYears * 100), 
                    currentAngle: initialPlanetAngle, 
                    orbitalInclinationRad: orbitalInclinationRad, 
                    eccentricity: eccentricity,
                    moonObjects: []
                };

                if (pData.moons && pData.moons.length > 0) {
                    pData.moons.forEach(mData => {
                        let moonMesh;
                        const moonMaterial = new THREE.MeshStandardMaterial({ color: mData.color, metalness: 0.1, roughness: 0.8 });
                        if (mData.isSpaceship) {
                            const shipSize = mData.visualSize || 0.1; 
                            const moonGeometry = new THREE.TetrahedronGeometry(shipSize, 0); 
                            moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
                        } else if (mData.isCube) {
                            const cubeSize = mData.visualSize || 0.3; 
                            const moonGeometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
                            moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
                        } else { 
                            const moonGeometry = new THREE.SphereGeometry(mData.visualRadius, 8, 4);
                            moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
                        }
                        moonMesh.name = mData.name; 
                        moonMesh.userData = { isMoon: true, name: mData.name, visualRadius: mData.visualRadius || mData.visualSize }; 

                        const scaledMoonOrbitalRadius = pData.visualRadius + mData.orbitalRadius; 
                        const fleetAngleOffset = mData.isSpaceship ? (mData.fleetOffsetAngle || 0) : 0;
                        const initialMoonAngle = (Math.random() * Math.PI * 0.2) + fleetAngleOffset; 

                        moonMesh.position.x = scaledMoonOrbitalRadius * Math.cos(initialMoonAngle);
                        moonMesh.position.z = scaledMoonOrbitalRadius * Math.sin(initialMoonAngle);
                        planetMesh.add(moonMesh); 
                        clickableObjects.push(moonMesh); 

                        const moonObj = {
                            mesh: moonMesh,
                            orbitalRadius: scaledMoonOrbitalRadius,
                            angularSpeedBase: (2 * Math.PI) / (mData.orbitalPeriodDays * 5), 
                            currentAngle: initialMoonAngle,
                            isSpaceship: mData.isSpaceship 
                        };
                        planetObject.moonObjects.push(moonObj);
                    });
                }
                planets.push(planetObject); 
                scene.add(planetMesh);
                clickableObjects.push(planetMesh); 

                const orbitPoints = [];
                const orbitSegments = 128; 
                for (let i = 0; i <= orbitSegments; i++) {
                    const M = (i / orbitSegments) * Math.PI * 2; 
                    let E = M; 
                    for (let k=0; k<5; k++) { 
                        E = E - (E - eccentricity * Math.sin(E) - M) / (1 - eccentricity * Math.cos(E));
                    }
                    const v = 2 * Math.atan2(Math.sqrt(1+eccentricity)*Math.sin(E/2), Math.sqrt(1-eccentricity)*Math.cos(E/2)); 
                    const r_true = scaledPlanetOrbitalRadius * (1 - eccentricity*eccentricity) / (1 + eccentricity * Math.cos(v));

                    orbitPoints.push(new THREE.Vector3(r_true * Math.cos(v), 0, r_true * Math.sin(v)));
                }
                const orbitGeometry = new THREE.BufferGeometry().setFromPoints(orbitPoints);
                const orbitMaterial = new THREE.LineBasicMaterial({ color: pData.color, transparent: true, opacity: 0.3 });
                const orbitLine = new THREE.Line(orbitGeometry, orbitMaterial);
                orbitLine.rotation.x = orbitalInclinationRad; 
                orbitLine.visible = orbitLinesVisible; 
                scene.add(orbitLine);
                orbitLineMeshes.push(orbitLine); 

                if (pData.hasRings) {
                    const ringInnerRadius = pData.visualRadius * 1.3;
                    const ringOuterRadius = pData.visualRadius * 2.5;
                    const ringGeometry = new THREE.RingGeometry(ringInnerRadius, ringOuterRadius, 32);
                    const ringMaterial = new THREE.MeshStandardMaterial({ color: 0xAAAAAA, metalness: 0.3, roughness: 0.7, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
                    const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);
                    ringMesh.rotation.x = Math.PI / 2; 
                    planetMesh.add(ringMesh);
                }
            });
        }

        function createAsteroidBelts() {
            asteroidBeltsData.forEach(beltData => {
                const beltAsteroids = [];
                for (let i = 0; i < beltData.count; i++) {
                    let asteroidGeometry;
                    const type = Math.random();
                    const size = 0.03 + Math.random() * 0.07; 

                    if (type < 0.4) {
                        asteroidGeometry = new THREE.IcosahedronGeometry(size, 0);
                    } else if (type < 0.7) {
                        asteroidGeometry = new THREE.DodecahedronGeometry(size, 0);
                    } else {
                        asteroidGeometry = new THREE.TetrahedronGeometry(size, 0);
                    }
                    
                    const asteroidMaterial = new THREE.MeshStandardMaterial({ 
                        color: new THREE.Color(beltData.color).offsetHSL(Math.random() * 0.3 - 0.15, Math.random() * 0.2 - 0.1, Math.random() * 0.2 - 0.1), 
                        metalness: 0.1, 
                        roughness: 0.9 
                    });
                    const asteroid = new THREE.Mesh(asteroidGeometry, asteroidMaterial);

                    const radius = (beltData.minRadiusAU + Math.random() * (beltData.maxRadiusAU - beltData.minRadiusAU)) * DISTANCE_SCALE_AU_TO_THREEJS;
                    const angle = Math.random() * Math.PI * 2;
                    const inclination = THREE.MathUtils.degToRad(beltData.minInclination + Math.random() * (beltData.maxInclination - beltData.minInclination));
                    
                    let yOffset = (Math.random() - 0.5) * beltData.thickness; 

                    let pos = new THREE.Vector3(radius * Math.cos(angle), yOffset, radius * Math.sin(angle));
                    pos.applyAxisAngle(new THREE.Vector3(1,0,0), inclination); 

                    asteroid.position.copy(pos);
                    asteroid.userData = {
                        isAsteroid: true,
                        orbitalRadius: radius,
                        currentAngle: angle,
                        angularSpeedBase: (2 * Math.PI) / ((150 + Math.random() * 250) * 100), 
                        orbitalInclinationRad: inclination,
                        yOffset: yOffset 
                    };
                    scene.add(asteroid);
                    beltAsteroids.push(asteroid);
                }
                asteroidBelts.push(beltAsteroids);
            });
        }

        function createComets() {
            cometsData.forEach(cData => {
                const cometGeometry = new THREE.SphereGeometry(cData.visualRadius, 8, 6);
                const cometMaterial = new THREE.MeshStandardMaterial({ color: cData.color, emissive: cData.color, emissiveIntensity: 0.3, roughness: 0.7 });
                const cometMesh = new THREE.Mesh(cometGeometry, cometMaterial);
                cometMesh.userData = { 
                    isComet: true, 
                    name: cData.name, 
                    visualRadius: cData.visualRadius 
                };

                const a = cData.semiMajorAxisAU * DISTANCE_SCALE_AU_TO_THREEJS;
                const e = cData.eccentricity;
                const r_perihelion = a * (1 - e); 

                let pos = new THREE.Vector3(r_perihelion, 0, 0); 

                const incl = THREE.MathUtils.degToRad(cData.inclinationDegrees);
                const Omega = THREE.MathUtils.degToRad(cData.longitudeOfAscendingNodeDegrees);
                const omega_arg = THREE.MathUtils.degToRad(cData.argumentOfPeriapsisDegrees);

                pos.applyAxisAngle(new THREE.Vector3(0,0,1), omega_arg);
                const xAxisOrbitalPlane = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,0,1), omega_arg);
                pos.applyAxisAngle(xAxisOrbitalPlane, incl);
                pos.applyAxisAngle(new THREE.Vector3(0,1,0), Omega); 
                
                cometMesh.position.copy(pos);

                const trailMaterial = new THREE.LineBasicMaterial({ 
                    color: cData.color, 
                    transparent: true, 
                    opacity: 0.5 
                });
                const trailGeometry = new THREE.BufferGeometry();
                const trailMesh = new THREE.Line(trailGeometry, trailMaterial);
                trailMesh.visible = false;
                scene.add(trailMesh);

                const cometObj = {
                    mesh: cometMesh,
                    data: cData, 
                    currentAngle: 0, 
                    angularSpeedBase: (2 * Math.PI) / (cData.orbitalPeriodYears * 100),
                    trailPoints: [], 
                    trailMesh: trailMesh 
                };
                comets.push(cometObj);
                scene.add(cometMesh);
                clickableObjects.push(cometMesh); 
            });
        }

        function createStations() {
            stationsData.forEach(sData => {
                let stationMesh;
                switch (sData.type) {
                    case "CORIOLIS": stationMesh = createCoriolisStation(sData); break;
                    case "TORUS": stationMesh = createTorusStation(sData); break;
                    case "MODULAR": stationMesh = createModularStation(sData); break;
                    case "ONEILL_CYLINDER": stationMesh = createONeillCylinderStation(sData); break;
                    case "DODEC_OUTPOST": stationMesh = createDodecOutpostStation(sData); break;
                    case "GEODESIC_DOME_CLUSTER": stationMesh = createGeodesicDomeClusterStation(sData); break;
                    case "LAUNCH_PLATFORM_ARRAY": stationMesh = createLaunchPlatformArrayStation(sData); break;
                    case "ASTEROID_BASE": 
                        stationMesh = new THREE.Mesh(new THREE.SphereGeometry(sData.visualSize * 0.5, 8, 6), new THREE.MeshStandardMaterial({color: sData.color, metalness:0.2, roughness:0.8}));
                        stationMesh.userData = { isStation: true, name: sData.name, type: sData.type, visualSize: sData.visualSize };
                        break;
                    case "TRUSS_SPINDLE": stationMesh = createTrussSpindleStation(sData); break;
                    case "SKELETAL_FRAME": stationMesh = createSkeletalFrameStation(sData); break;
                    default:
                        console.warn("Unknown station type:", sData.type);
                        stationMesh = new THREE.Mesh(new THREE.BoxGeometry(sData.visualSize, sData.visualSize, sData.visualSize), new THREE.MeshStandardMaterial({color: 0xff0000}));
                        stationMesh.userData = { isStation: true, name: sData.name, type: "UNKNOWN", visualSize: sData.visualSize };
                }

                let parentObjectMesh;
                let parentVisualRadius = 0;
                let parentOrbitalRadius = 0; 
                let parentCurrentAngle = 0;  

                if (sData.orbitsBody) {
                    const planetParent = planets.find(p => p.mesh.userData.name === sData.orbitsBody);
                    if (planetParent) {
                        parentObjectMesh = planetParent.mesh;
                        parentVisualRadius = planetParent.mesh.userData.visualRadius;
                    } else { 
                        for (const p of planets) {
                            const moonParent = p.moonObjects.find(m => m.mesh.name === sData.orbitsBody);
                            if (moonParent) {
                                parentObjectMesh = moonParent.mesh;
                                parentVisualRadius = moonParent.mesh.userData.visualRadius || 0.1; 
                                break;
                            }
                        }
                    }
                } else if (sData.inAsteroidBelt) {
                    parentObjectMesh = sun;
                    const beltInfo = asteroidBeltsData.find(b => b.name === sData.inAsteroidBelt);
                    if (beltInfo) {
                        sData.orbitalRadius = (beltInfo.minRadiusAU + Math.random() * (beltInfo.maxRadiusAU - beltInfo.minRadiusAU)) * DISTANCE_SCALE_AU_TO_THREEJS;
                    } else {
                         sData.orbitalRadius = 40 * DISTANCE_SCALE_AU_TO_THREEJS;
                    }
                }
                // Removed customOrbit logic for L1 and L5

                // Corrected stationOrbitalRadius logic
                let stationOrbitalRadius;
                if (sData.orbitsBody === "Sun" && sData.orbitalRadiusAU) {
                    stationOrbitalRadius = sData.orbitalRadiusAU * DISTANCE_SCALE_AU_TO_THREEJS;
                } else if (sData.inAsteroidBelt) {
                    stationOrbitalRadius = sData.orbitalRadius;
                } else {
                    // For stations orbiting planets or moons, sData.orbitalRadius is from the parent's center
                    // or already scaled if it was an L-point station (now removed)
                    stationOrbitalRadius = sData.orbitalRadius;
                }
                
                let initialAngle = Math.random() * Math.PI * 2;
                // Removed customOrbit angle adjustments
                
                stationMesh.position.x = stationOrbitalRadius * Math.cos(initialAngle);
                stationMesh.position.z = stationOrbitalRadius * Math.sin(initialAngle);
                
                if(parentObjectMesh === sun && sData.orbitalInclinationDegrees) {
                    const stationInclinationRad = THREE.MathUtils.degToRad(sData.orbitalInclinationDegrees);
                    stationMesh.position.applyAxisAngle(new THREE.Vector3(1,0,0), stationInclinationRad);
                }


                if (parentObjectMesh && !sData.inAsteroidBelt) { // Simplified: if parented and not asteroid base, add to parent
                    parentObjectMesh.add(stationMesh);
                } else { // Add to scene (Sun-orbiting, asteroid base, or unparented)
                    scene.add(stationMesh);
                }
                
                const stationObject = {
                    mesh: stationMesh,
                    parentMesh: parentObjectMesh || sun, 
                    orbitalRadius: stationOrbitalRadius,
                    angularSpeedBase: (2 * Math.PI) / ((sData.orbitalPeriodDays || sData.orbitalPeriodYears * 365.25 || 1) * 20), 
                    currentAngle: initialAngle,
                    rotationSpeed: sData.rotationSpeed || 0,
                    orbitalInclinationRad: (parentObjectMesh === sun && sData.orbitalInclinationDegrees) ? THREE.MathUtils.degToRad(sData.orbitalInclinationDegrees) : 0,
                    // Removed Lagrange-specific properties: isL5Station, l5ParentMoonName, l5ParentPlanetName, isL1Station, l1SecondaryBodyName
                };
                stations.push(stationObject);
                clickableObjects.push(stationMesh);
            });
        }

        function createStars() {
            const starVertices = [];
            const starCount = 15000;
            const starSpread = 6000; 
            for (let i = 0; i < starCount; i++) {
                let x, y, z, distSq;
                const outermostOrbit = planetsData[planetsData.length - 1].orbitalRadiusAU * DISTANCE_SCALE_AU_TO_THREEJS;
                const minStarDist = outermostOrbit * 1.5; 
                do { 
                    x = (Math.random() - 0.5) * 2 * starSpread;
                    y = (Math.random() - 0.5) * 2 * starSpread;
                    z = (Math.random() - 0.5) * 2 * starSpread;
                    distSq = x * x + y * y + z * z;
                } while (distSq < minStarDist * minStarDist || distSq > starSpread * starSpread);
                starVertices.push(x, y, z);
            }
            const starGeometry = new THREE.BufferGeometry();
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: false });
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }

        function onDocumentMouseDown(event) {
            if (event.target.closest('#simulationControls') || event.target.closest('.modal') || event.target.closest('#objectSelectionMenu')) { 
                return;
            }

            if (!isCKeyDown && event.button === 0) { 
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(clickableObjects, true); 

                if (intersects.length > 0) {
                    let clickedObject = intersects[0].object;
                    if (clickedObject !== focusedObject) {
                         selectObjectByInteraction(clickedObject, true); 
                    }
                }
            } 
        }

        }

        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = globalClock.getDelta(); 
            const elapsedTime = globalClock.getElapsedTime();
            frameCount++;
            
            let wasdMoved = false;
            if (isWDown || isSDown || isADown || isDDown || isZDown || isXDown) {
                wasdMoved = true;
                const moveDirection = new THREE.Vector3();
                const rightDirection = new THREE.Vector3();
                
                camera.getWorldDirection(moveDirection);
                rightDirection.crossVectors(camera.up, moveDirection).normalize(); 
                const horizontalMoveDirection = moveDirection.clone();
                horizontalMoveDirection.y = 0; 
                horizontalMoveDirection.normalize();

                const actualMoveSpeed = FREE_MOVE_SPEED * deltaTime;
                let moveX = 0;
                let moveZ = 0;
                let moveY = 0;


                if (isWDown) { 
                    moveX += horizontalMoveDirection.x * actualMoveSpeed;
                    moveZ += horizontalMoveDirection.z * actualMoveSpeed;
                }
                if (isSDown) { 
                    moveX -= horizontalMoveDirection.x * actualMoveSpeed;
                    moveZ -= horizontalMoveDirection.z * actualMoveSpeed;
                }
                if (isADown) {
                    moveX += rightDirection.x * actualMoveSpeed;
                    moveZ += rightDirection.z * actualMoveSpeed;
                }
                if (isDDown) {
                    moveX -= rightDirection.x * actualMoveSpeed;
                    moveZ -= rightDirection.z * actualMoveSpeed;
                }
                if (isZDown) { 
                    moveY += actualMoveSpeed;
                }
                if (isXDown) { 
                    moveY -= actualMoveSpeed;
                }
                
                camera.position.x += moveX;
                camera.position.z += moveZ;
                camera.position.y += moveY;
                controls.target.x += moveX;
                controls.target.z += moveZ;
                controls.target.y += moveY;


                if (isFollowing) isFollowing = false;
                targetLookAtForFocus = null;
                targetCameraPositionForFocus = null;
                updateInfoBox(); 
            }

            if (!isPaused) {
                planets.forEach(p => { 
                    p.currentAngle += p.angularSpeedBase * simulationSpeed;
                    
                    const a = p.orbitalRadius; 
                    const e = p.eccentricity;
                    const M = p.currentAngle; 
                    
                    let E = M; 
                    for (let i = 0; i < 5; i++) { 
                        E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
                    }
                    
                    const v = 2 * Math.atan2(Math.sqrt(1 + e) * Math.sin(E / 2), Math.sqrt(1 - e) * Math.cos(E / 2));
                    const r = a * (1 - e * e) / (1 + e * Math.cos(v));

                    let newPosVec = new THREE.Vector3(
                        r * Math.cos(v), 
                        0, 
                        r * Math.sin(v) 
                    );
                    newPosVec.applyAxisAngle(new THREE.Vector3(1, 0, 0), p.orbitalInclinationRad);
                    p.mesh.position.copy(newPosVec);

                    p.mesh.rotation.y += 0.005 * simulationSpeed; 
                    p.moonObjects.forEach(m => {
                        m.currentAngle += m.angularSpeedBase * simulationSpeed * MOON_SIMULATION_SPEED_MULTIPLIER;
                        m.mesh.position.x = m.orbitalRadius * Math.cos(m.currentAngle);
                        m.mesh.position.z = m.orbitalRadius * Math.sin(m.currentAngle);
                        m.mesh.rotation.y += 0.01 * simulationSpeed * MOON_SIMULATION_SPEED_MULTIPLIER; 
                        if (m.mesh.name === "Borg Cube") { 
                            m.mesh.rotation.x += 0.003 * simulationSpeed * MOON_SIMULATION_SPEED_MULTIPLIER;
                        }
                        if (m.isSpaceship) {
                            m.mesh.rotation.x += 0.005 * simulationSpeed * MOON_SIMULATION_SPEED_MULTIPLIER;
                            m.mesh.rotation.z += 0.002 * simulationSpeed * MOON_SIMULATION_SPEED_MULTIPLIER;
                        }
                    });
                });

                asteroidBelts.forEach(belt => {
                    belt.forEach(asteroid => {
                        asteroid.userData.currentAngle += asteroid.userData.angularSpeedBase * simulationSpeed;
                        let astPos = new THREE.Vector3(
                            asteroid.userData.orbitalRadius * Math.cos(asteroid.userData.currentAngle),
                            asteroid.userData.yOffset, 
                            asteroid.userData.orbitalRadius * Math.sin(asteroid.userData.currentAngle)
                        );
                        astPos.applyAxisAngle(new THREE.Vector3(1,0,0), asteroid.userData.orbitalInclinationRad);
                        asteroid.position.copy(astPos);
                        asteroid.rotation.x += 0.01 * simulationSpeed;
                        asteroid.rotation.y += 0.015 * simulationSpeed;
                    });
                });

                comets.forEach(comet => {
                    comet.currentAngle += comet.angularSpeedBase * simulationSpeed; 
                    const cData = comet.data;
                    const a = cData.semiMajorAxisAU * DISTANCE_SCALE_AU_TO_THREEJS;
                    const e = cData.eccentricity;
                    const M = comet.currentAngle; 
                    
                    let E = M; 
                    for(let i=0; i<5; i++) { 
                        E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
                    }

                    const x_orb = a * (Math.cos(E) - e);
                    const y_orb = a * Math.sqrt(1 - e * e) * Math.sin(E); 
                    let posInOrbitalPlane = new THREE.Vector3(x_orb, 0, y_orb); 

                    const incl = THREE.MathUtils.degToRad(cData.inclinationDegrees);
                    const Omega = THREE.MathUtils.degToRad(cData.longitudeOfAscendingNodeDegrees);
                    const omega_arg = THREE.MathUtils.degToRad(cData.argumentOfPeriapsisDegrees);
                    
                    let q = new THREE.Quaternion();
                    let finalPos = new THREE.Vector3().copy(posInOrbitalPlane);
                    
                    q.setFromAxisAngle(new THREE.Vector3(0,0,1), omega_arg);
                    finalPos.applyQuaternion(q);
                    q.setFromAxisAngle(new THREE.Vector3(1,0,0), incl);
                    finalPos.applyQuaternion(q);
                    q.setFromAxisAngle(new THREE.Vector3(0,1,0), Omega);
                    finalPos.applyQuaternion(q);
                                        
                    comet.mesh.position.copy(finalPos);

                    if (frameCount % COMET_TRAIL_UPDATE_INTERVAL === 0) { 
                        const sunPosition = sun.position; 
                        const distanceToSunAU = comet.mesh.position.distanceTo(sunPosition) / DISTANCE_SCALE_AU_TO_THREEJS;

                        if (distanceToSunAU < COMET_TRAIL_PROXIMITY_AU) {
                            comet.trailPoints.push(comet.mesh.position.clone());
                            if (comet.trailPoints.length > MAX_TRAIL_POINTS) {
                                comet.trailPoints.shift(); 
                            }
                            if (comet.trailPoints.length > 1) {
                                comet.trailMesh.geometry.setFromPoints(comet.trailPoints);
                                comet.trailMesh.geometry.attributes.position.needsUpdate = true;
                                comet.trailMesh.visible = true;
                                comet.trailMesh.material.opacity = Math.max(0.1, 1 - (distanceToSunAU / COMET_TRAIL_PROXIMITY_AU) * 0.8);
                            }
                        } else {
                            if (comet.trailPoints.length > 0) {
                                comet.trailPoints.shift(); 
                                if (comet.trailPoints.length > 1) {
                                    comet.trailMesh.geometry.setFromPoints(comet.trailPoints);
                                    comet.trailMesh.geometry.attributes.position.needsUpdate = true;
                                } else {
                                    comet.trailMesh.visible = false;
                                }
                            } else {
                                comet.trailMesh.visible = false;
                            }
                        }
                    }
                });

                stations.forEach(s => {
                    // Removed isL5Station and isL1Station specific logic.
                    // Standard station update logic:
                    s.currentAngle += s.angularSpeedBase * simulationSpeed;
                        let newStationPos = new THREE.Vector3(
                            s.orbitalRadius * Math.cos(s.currentAngle),
                            0, 
                            s.orbitalRadius * Math.sin(s.currentAngle)
                        );
                        if (s.parentMesh === sun && s.orbitalInclinationRad) { // For Sun-orbiting stations
                            newStationPos.applyAxisAngle(new THREE.Vector3(1,0,0), s.orbitalInclinationRad);
                        }
                        // If station is parented to a planet/moon, its position is relative.
                        // If parented to Sun or scene, its position is absolute.
                        // The createStations logic adds stations orbiting planets/moons to those objects.
                        // Sun-orbiting stations are added to the scene.
                        if (s.parentMesh && s.parentMesh !== sun) {
                             // Position is already relative to parent, THREE.js handles world transform
                             s.mesh.position.copy(newStationPos);
                        } else { // Orbiting Sun or unparented (should be added to scene)
                             s.mesh.position.copy(newStationPos);
                        }
                    // The extra '}' was here, now removed. The 's.currentAngle += ...' is the start of the main logic block.

                    if (s.rotationSpeed) {
                        if(s.mesh.userData.type === "ONEILL_CYLINDER" || s.mesh.userData.type === "CORIOLIS" || s.mesh.userData.type === "TRUSS_SPINDLE"){
                             s.mesh.rotation.y += s.rotationSpeed * simulationSpeed; 
                        } else {
                             s.mesh.rotation.y += s.rotationSpeed * simulationSpeed; 
                        }
                    }
                    if (s.mesh.userData.navLights && s.mesh.userData.navLights.length > 0) {
                        const blinkState = Math.floor(elapsedTime * (2 + Math.random()*0.5)) % 2 === 0; 
                        s.mesh.userData.navLights.forEach(light => {
                            light.visible = blinkState;
                        });
                    }
                });
            }

            if (!wasdMoved) {
                if (isFollowing && focusedObject) {
                    const currentFollowTargetPos = focusedObject.getWorldPosition(new THREE.Vector3());
                    controls.target.copy(currentFollowTargetPos); 

                    const objectRadius = (focusedObject.userData.isPlanet || focusedObject.userData.name === "Sun")
                                        ? (focusedObject.userData.name === "Sun" ? sunData.visualRadius : focusedObject.userData.visualRadius)
                                        : (focusedObject.userData.isComet ? focusedObject.userData.visualRadius 
                                        : (focusedObject.userData.isStation ? focusedObject.userData.visualSize 
                                        : (focusedObject.userData.isMoon ? focusedObject.userData.visualRadius : 1)));
                    
                    let mediumDistanceMultiplier;
                    if (focusedObject.userData.name === "Sun") mediumDistanceMultiplier = 3.5;
                    else if (focusedObject.userData.isPlanet) mediumDistanceMultiplier = 6;
                    else if (focusedObject.userData.isComet) mediumDistanceMultiplier = 25;
                    else if (focusedObject.userData.isStation) mediumDistanceMultiplier = 5;
                    else mediumDistanceMultiplier = 10;
                    
                    const followDistance = objectRadius * mediumDistanceMultiplier;
                    const directionToCamera = new THREE.Vector3().subVectors(camera.position, currentFollowTargetPos).normalize();
                    const desiredCameraPosition = new THREE.Vector3().addVectors(currentFollowTargetPos, directionToCamera.multiplyScalar(followDistance));
                    
                    if (targetCameraPositionForFocus) { 
                        camera.position.lerp(targetCameraPositionForFocus, 0.05);
                        if (camera.position.distanceTo(targetCameraPositionForFocus) < 0.1) {
                            targetCameraPositionForFocus = null; 
                        }
                    } else { 
                         camera.position.lerp(desiredCameraPosition, 0.1); 
                    }
                    targetLookAtForFocus = null; 

                } else if (targetLookAtForFocus) { 
                    const lerpFactor = 0.05;
                    controls.target.lerp(targetLookAtForFocus, lerpFactor);

                    if (targetCameraPositionForFocus) {
                        camera.position.lerp(targetCameraPositionForFocus, lerpFactor);
                    }

                    const targetReached = controls.target.distanceTo(targetLookAtForFocus) < 0.1;
                    const positionReached = !targetCameraPositionForFocus || camera.position.distanceTo(targetCameraPositionForFocus) < 0.1;

                    if (targetReached && positionReached) {
                        controls.target.copy(targetLookAtForFocus); 
                        if (targetCameraPositionForFocus) camera.position.copy(targetCameraPositionForFocus); 
                        targetLookAtForFocus = null;
                        targetCameraPositionForFocus = null;
                    }
                }
            }
            
            if (focusedObject && focusedObject.userData.isStation && isFollowing) {
                const distToStation = camera.position.distanceTo(focusedObject.getWorldPosition(new THREE.Vector3()));
                const dockingRange = focusedObject.userData.visualSize * 2.0; 
                if (distToStation < dockingRange) {
                    highlightMesh.material.color.setHex(0x00FF00); 
                    if (!infoBox.textContent.includes("Docking")) { 
                         updateInfoBox(); 
                    }
                } else {
                    highlightMesh.material.color.setHex(0xFFFF00); 
                }
            } else if (highlightMesh.material.color.getHex() === 0x00FF00) { 
                 highlightMesh.material.color.setHex(0xFFFF00);
            }


            if (focusedObject) {
                 highlightMesh.position.copy(focusedObject.getWorldPosition(new THREE.Vector3()));
                 if (!highlightMesh.visible) { 
                    updateHighlightAndGeminiButton(); 
                 }
            } else if (highlightMesh.visible) {
                highlightMesh.visible = false; 
            }

            controls.update(); 
            renderer.render(scene, camera);
        }

        function toggleBrowserFullscreen() {

                });

                if (document.exitFullscreen) {

                }
            }
